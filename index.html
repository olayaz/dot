<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>做到了</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #1c1c1e;
    --ink-2: #8a8a8e;
    --done: #34a853;
    --line: #e8e6e1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "PingFang TC", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  header {
    padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
  }
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .date-nav button {
    border: none;
    background: none;
    font-size: 26px;
    color: var(--ink-2);
    padding: 4px 14px;
    cursor: pointer;
  }
  .date-label {
    font-size: 18px;
    font-weight: 600;
    position: relative;
    cursor: pointer;
    text-align: center;
  }
  .date-label .sub { display: block; font-size: 12px; font-weight: 400; color: var(--ink-2); }
  #datePicker { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .stats {
    margin-top: 8px;
    font-size: 13px;
    color: var(--ink-2);
    text-align: center;
  }
  .stats b { color: var(--ink); font-weight: 600; }

  #list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 12px 12px;
  }
  .empty {
    text-align: center;
    color: var(--ink-2);
    font-size: 14px;
    margin-top: 60px;
    line-height: 1.8;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 0 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .entry {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .entry:last-child { border-bottom: none; }
  .entry:active { background: #fafaf8; }
  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }
  .dot.done { background: var(--done); }
  .dot.todo { background: transparent; border: 2px solid #c7c7cc; }
  .body { flex: 1; min-width: 0; }
  .topline { display: flex; align-items: flex-start; gap: 8px; }
  .text { flex: 1; font-size: 16px; line-height: 1.45; word-break: break-word; }
  .time { font-size: 12px; color: var(--ink-2); margin-top: 3px; flex-shrink: 0; }
  .note {
    font-size: 14px;
    color: var(--ink-2);
    margin-top: 4px;
    line-height: 1.4;
    word-break: break-word;
  }
  .del {
    border: none; background: none; color: #c7c7cc; font-size: 18px;
    padding: 0 2px; cursor: pointer; flex-shrink: 0;
  }

  /* 居中懸浮窗口:不錨定屏幕底部,鍵盤彈出時只需在剩餘可視區域重新居中,
     位移很小;top/height 由 JS 跟隨 visualViewport 設置 */
  #overlay {
    position: fixed;
    left: 0; right: 0; top: 0;
    height: 100dvh;
    background: rgba(0,0,0,.25);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay[hidden] { display: none; }
  .sheet {
    background: #fff;
    width: min(330px, 86%);
    border-radius: 14px;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 16px);
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
  }
  .sheet-text {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 12px;
    word-break: break-word;
  }
  #sheetInput {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 16px;
    outline: none;
  }
  .sheet-btns { display: flex; gap: 8px; margin-top: 12px; }
  .sheet-btns button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 12px 0;
    font-size: 15px;
    cursor: pointer;
  }
  #sheetCancel { background: #eceef1; color: var(--ink); }
  #sheetOk { background: var(--ink); color: #fff; }
  #sheetUndone {
    display: block;
    margin: 12px auto 0;
    border: none;
    background: none;
    color: var(--ink-2);
    font-size: 13px;
    cursor: pointer;
  }

  footer {
    padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
    border-top: 1px solid var(--line);
  }
  .add-btns { display: flex; gap: 8px; }
  .add-btns button {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 13px 0;
    font-size: 16px;
    cursor: pointer;
  }
  #btnPlan { background: #eceef1; color: var(--ink); }
  #btnDone { background: var(--ink); color: #fff; }
  .tools {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .tools button {
    border: none; background: none; color: var(--ink-2);
    font-size: 12px; cursor: pointer; padding: 2px 8px;
  }
  .ver { font-size: 10px; color: #d1d1d6; }
</style>
</head>
<body>

<header>
  <div class="date-nav">
    <button id="prevDay" aria-label="前一天">‹</button>
    <div class="date-label">
      <span id="dateText"></span>
      <span class="sub" id="weekText"></span>
      <input type="date" id="datePicker">
    </div>
    <button id="nextDay" aria-label="後一天">›</button>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div id="list"></div>

<footer>
  <div class="add-btns">
    <button id="btnPlan">記為待做</button>
    <button id="btnDone">做到了,記一筆</button>
  </div>
  <div class="tools">
    <button id="btnExport">導出備份</button>
    <button id="btnImport">導入備份</button>
    <span class="ver">v0.8</span>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </div>
</footer>

<div id="overlay" hidden>
  <div class="sheet">
    <div class="sheet-text" id="sheetText"></div>
    <input id="sheetInput" type="text" enterkeyhint="done">
    <div class="sheet-btns">
      <button id="sheetCancel">取消</button>
      <button id="sheetOk">記下</button>
    </div>
    <button id="sheetUndone" hidden>改回沒做</button>
  </div>
</div>

<script>
(function () {
  var KEY = 'wins.v1';
  var data = load();
  var current = today();

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('list');

  function load() {
    var d;
    try { d = JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch (e) { d = {}; }
    // 舊數據遷移:統一成 { text, done, note?, ts, doneTs? }
    for (var k in d) {
      d[k].forEach(function (e) {
        if ('status' in e) {
          e.done = e.status !== 'open';
          delete e.status;
        }
        delete e.kind;
        if (!('done' in e)) e.done = true;
      });
    }
    return d;
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

  function pad(n) { return String(n).padStart(2, '0'); }
  function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { var d = new Date(); d.setHours(0,0,0,0); return d; }

  function entries(d) { return data[dayKey(d)] || []; }

  function scrollToBottom() {
    requestAnimationFrame(function () { listEl.scrollTop = listEl.scrollHeight; });
  }

  function addEntry(text, done) {
    text = text.trim();
    if (!text) return false;
    var k = dayKey(current);
    if (!data[k]) data[k] = [];
    var now = Date.now();
    var e = {
      id: now + '' + Math.floor(Math.random() * 1000),
      text: text,
      done: done,
      ts: now
    };
    if (done) e.doneTs = now;
    data[k].push(e);
    save();
    render();
    scrollToBottom();
    return true;
  }

  function removeEntry(k, id) {
    data[k] = (data[k] || []).filter(function (e) { return e.id !== id; });
    if (!data[k].length) delete data[k];
    save();
    render();
  }

  // ---- stats ----
  function totalCount() {
    var n = 0;
    for (var k in data) n += data[k].length;
    return n;
  }
  function streak() {
    var d = today();
    if (!entries(d).length) d.setDate(d.getDate() - 1);
    var n = 0;
    while (entries(d).length) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  // ---- 底部彈窗 ----
  // sheetMode: 'add-plan' | 'add-done' | 'edit'
  var sheetMode = null;
  var editing = null; // { k, e }

  function showSheet() {
    $('overlay').hidden = false;
    syncViewport();
    setTimeout(function () { $('sheetInput').focus(); }, 50);
  }
  function closeSheet() {
    sheetMode = null;
    editing = null;
    $('overlay').hidden = true;
    $('overlay').style.top = '';
    $('overlay').style.height = '';
    $('sheetInput').blur();
  }

  // 點底部按鈕:彈出輸入窗口,後面的列表仍然可見
  function openAddSheet(kind) {
    sheetMode = kind === 'plan' ? 'add-plan' : 'add-done';
    editing = null;
    $('sheetText').textContent = kind === 'plan' ? '記為待做' : '做到了,記一筆';
    $('sheetInput').value = '';
    $('sheetInput').placeholder = kind === 'plan' ? '寫下待做的事' : '寫下做成的事';
    $('sheetOk').textContent = '記下';
    $('sheetCancel').textContent = '完成';
    $('sheetUndone').hidden = true;
    scrollToBottom();
    showSheet();
  }

  // 點某一行:寫/改結果
  function openEditSheet(k, e) {
    sheetMode = 'edit';
    editing = { k: k, e: e };
    $('sheetText').textContent = e.text;
    $('sheetInput').value = e.note || '';
    $('sheetInput').placeholder = '結果怎麼樣?一句話寫下來';
    $('sheetOk').textContent = e.done ? '記下' : '做了,記下';
    $('sheetCancel').textContent = '取消';
    $('sheetUndone').hidden = !e.done;
    showSheet();
  }

  $('sheetOk').addEventListener('click', function () {
    var inp = $('sheetInput');
    if (sheetMode === 'edit') {
      if (!editing) return;
      var e = editing.e;
      var note = inp.value.trim();
      if (note) e.note = note; else delete e.note;
      if (!e.done) e.doneTs = Date.now(); // 時間 = 標記為做了的那一刻
      e.done = true;
      save();
      closeSheet();
      render();
    } else if (sheetMode) {
      // 記一條,清空,窗口不收起,可連續記;新行立刻出現在後面的列表裡
      if (addEntry(inp.value, sheetMode === 'add-done')) {
        inp.value = '';
        inp.focus();
      }
    }
  });
  $('sheetCancel').addEventListener('click', closeSheet);
  $('overlay').addEventListener('click', function (ev) {
    if (ev.target === this) closeSheet();
  });
  $('sheetInput').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') $('sheetOk').click();
  });
  $('sheetUndone').addEventListener('click', function () {
    if (!editing) return;
    editing.e.done = false;
    delete editing.e.doneTs;
    save();
    closeSheet();
    render();
  });

  // 鍵盤彈出時 Safari 會滾動並縮小可視區域;
  // 彈窗的 top 和 height 都實時跟隨,保證貼在鍵盤上方不被推走
  function syncViewport() {
    var vv = window.visualViewport;
    if (!vv || $('overlay').hidden) return;
    $('overlay').style.top = vv.offsetTop + 'px';
    $('overlay').style.height = vv.height + 'px';
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncViewport);
    window.visualViewport.addEventListener('scroll', syncViewport);
  }

  // ---- render ----
  var WEEK = ['日','一','二','三','四','五','六'];
  function fmtTime(ts) {
    var d = new Date(ts);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function render() {
    var isToday = dayKey(current) === dayKey(today());
    $('dateText').textContent = (current.getMonth() + 1) + ' 月 ' + current.getDate() + ' 日';
    $('weekText').textContent = '星期' + WEEK[current.getDay()] + (isToday ? ' · 今天' : '');
    $('datePicker').value = dayKey(current);

    $('stats').innerHTML = '今天 <b>' + entries(today()).length + '</b> 條 · 連續 <b>' + streak() + '</b> 天 · 累計 <b>' + totalCount() + '</b> 條';

    var arr = entries(current);
    if (!arr.length) {
      listEl.innerHTML = '<div class="empty">這一天還沒有記錄。<br>點下面的按鈕,記一筆吧。</div>';
      return;
    }
    var k = dayKey(current);
    var card = document.createElement('div');
    card.className = 'card';

    arr.forEach(function (e) {
      var row = document.createElement('div');
      row.className = 'entry';

      // 只有「做了」才有時間可說:顯示標記完成的那一刻,同行末尾小灰字
      var timeHtml = e.done ? '<span class="time">' + fmtTime(e.doneTs || e.ts) + '</span>' : '';

      row.innerHTML =
        '<span class="dot ' + (e.done ? 'done' : 'todo') + '"></span>' +
        '<div class="body">' +
          '<div class="topline"><div class="text"></div>' + timeHtml + '</div>' +
          (e.note ? '<div class="note"></div>' : '') +
        '</div>' +
        '<button class="del" aria-label="刪除">×</button>';
      row.querySelector('.text').textContent = e.text;
      var noteEl = row.querySelector('.note');
      if (noteEl) noteEl.textContent = '→ ' + e.note;

      row.addEventListener('click', function () { openEditSheet(k, e); });
      row.querySelector('.del').addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (confirm('刪掉這一條?')) removeEntry(k, e.id);
      });

      card.appendChild(row);
    });

    listEl.innerHTML = '';
    listEl.appendChild(card);
  }

  // ---- 底部兩個按鈕:唯一的輸入入口 ----
  $('btnPlan').addEventListener('click', function () { openAddSheet('plan'); });
  $('btnDone').addEventListener('click', function () { openAddSheet('done'); });

  // ---- 日期切換 ----
  $('prevDay').addEventListener('click', function () { current.setDate(current.getDate() - 1); render(); });
  $('nextDay').addEventListener('click', function () { current.setDate(current.getDate() + 1); render(); });
  $('datePicker').addEventListener('change', function () {
    if (!this.value) return;
    var p = this.value.split('-');
    current = new Date(+p[0], +p[1] - 1, +p[2]);
    render();
  });

  // ---- 備份 ----
  $('btnExport').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'backup-' + dayKey(today()) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  $('btnImport').addEventListener('click', function () { $('importFile').click(); });
  $('importFile').addEventListener('change', function () {
    var f = this.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var imported = JSON.parse(r.result);
        if (typeof imported !== 'object' || imported === null) throw new Error();
        if (!confirm('導入會覆蓋目前所有資料,確定嗎?(建議先導出備份)')) return;
        data = imported;
        save();
        render();
        alert('導入成功');
      } catch (e) {
        alert('文件格式不對,導入失敗');
      }
    };
    r.readAsText(f);
    this.value = '';
  });

  render();
})();
</script>
</body>
</html>
