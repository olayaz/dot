<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>做到了</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #1c1c1e;
    --ink-2: #8a8a8e;
    --done: #34a853;
    --half: #e8a13a;
    --stuck: #c0564b;
    --line: #e8e6e1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "PingFang TC", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  header {
    padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
  }
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .date-nav button {
    border: none;
    background: none;
    font-size: 26px;
    color: var(--ink-2);
    padding: 4px 14px;
    cursor: pointer;
  }
  .date-label {
    font-size: 18px;
    font-weight: 600;
    position: relative;
    cursor: pointer;
    text-align: center;
  }
  .date-label .sub { display: block; font-size: 12px; font-weight: 400; color: var(--ink-2); }
  #datePicker { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .stats {
    margin-top: 8px;
    font-size: 13px;
    color: var(--ink-2);
    text-align: center;
  }
  .stats b { color: var(--ink); font-weight: 600; }

  #list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 12px 12px;
  }
  .empty {
    text-align: center;
    color: var(--ink-2);
    font-size: 14px;
    margin-top: 60px;
    line-height: 1.8;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 0 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .entry {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .entry:last-child { border-bottom: none; }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-top: 7px;
    flex-shrink: 0;
  }
  .dot.done  { background: var(--done); }
  .dot.half  { background: var(--half); }
  .dot.stuck { background: var(--stuck); }
  .dot.open  { background: transparent; border: 2px solid #c7c7cc; width: 12px; height: 12px; margin-top: 6px; }
  .body { flex: 1; min-width: 0; }
  .text { font-size: 16px; line-height: 1.45; word-break: break-word; }
  .meta { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  .status-label { cursor: pointer; }
  .status-label.done  { color: var(--done); }
  .status-label.half  { color: var(--half); }
  .status-label.stuck { color: var(--stuck); }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions button {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    font-size: 13px;
    padding: 4px 12px;
    color: var(--ink);
    cursor: pointer;
  }
  .actions button:active { background: var(--bg); }
  .del {
    border: none; background: none; color: #c7c7cc; font-size: 18px;
    padding: 0 2px; cursor: pointer; flex-shrink: 0;
  }

  footer {
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 10px);
    border-top: 1px solid var(--line);
  }
  #input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 12px;
    font-size: 16px;
    background: #fff;
    outline: none;
  }
  .add-btns { display: flex; gap: 8px; margin-top: 8px; }
  .add-btns button {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 11px 0;
    font-size: 15px;
    cursor: pointer;
  }
  #btnPlan { background: #eceef1; color: var(--ink); }
  #btnDone { background: var(--ink); color: #fff; }
  .tools { text-align: center; margin-top: 8px; }
  .tools button {
    border: none; background: none; color: var(--ink-2);
    font-size: 12px; cursor: pointer; padding: 2px 8px;
  }
</style>
</head>
<body>

<header>
  <div class="date-nav">
    <button id="prevDay" aria-label="前一天">‹</button>
    <div class="date-label">
      <span id="dateText"></span>
      <span class="sub" id="weekText"></span>
      <input type="date" id="datePicker">
    </div>
    <button id="nextDay" aria-label="後一天">›</button>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div id="list"></div>

<footer>
  <input id="input" type="text" placeholder="寫點什麼…" enterkeyhint="done" autocomplete="off">
  <div class="add-btns">
    <button id="btnPlan">記為待做</button>
    <button id="btnDone">做到了,記一筆</button>
  </div>
  <div class="tools">
    <button id="btnExport">導出備份</button>
    <button id="btnImport">導入備份</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </div>
</footer>

<script>
(function () {
  var KEY = 'wins.v1';
  var data = load();
  var current = today();

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('list'), inputEl = $('input');

  var STATUS_LABEL = { open: '待做', done: '做到了', half: '做了一半', stuck: '卡住了' };

  function load() {
    var d;
    try { d = JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch (e) { d = {}; }
    // 舊數據遷移:去掉 kind 欄位,統一成一種記錄
    for (var k in d) {
      d[k].forEach(function (e) {
        delete e.kind;
        if (!e.status) e.status = 'done';
      });
    }
    return d;
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

  function pad(n) { return String(n).padStart(2, '0'); }
  function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { var d = new Date(); d.setHours(0,0,0,0); return d; }

  function entries(d) { return data[dayKey(d)] || []; }

  function addEntry(text, status) {
    text = text.trim();
    if (!text) return;
    var k = dayKey(current);
    if (!data[k]) data[k] = [];
    data[k].push({
      id: Date.now() + '' + Math.floor(Math.random() * 1000),
      text: text,
      status: status,   // open | done | half | stuck
      ts: Date.now()
    });
    save();
    render();
  }

  function setStatus(k, id, status) {
    var arr = data[k] || [];
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === id) { arr[i].status = status; break; }
    }
    save();
    render();
  }

  function removeEntry(k, id) {
    data[k] = (data[k] || []).filter(function (e) { return e.id !== id; });
    if (!data[k].length) delete data[k];
    save();
    render();
  }

  // ---- stats ----
  function totalCount() {
    var n = 0;
    for (var k in data) n += data[k].length;
    return n;
  }
  function streak() {
    var d = today();
    if (!entries(d).length) d.setDate(d.getDate() - 1);
    var n = 0;
    while (entries(d).length) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  // ---- render ----
  var WEEK = ['日','一','二','三','四','五','六'];
  function fmtTime(ts) {
    var d = new Date(ts);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function render() {
    var isToday = dayKey(current) === dayKey(today());
    $('dateText').textContent = (current.getMonth() + 1) + ' 月 ' + current.getDate() + ' 日';
    $('weekText').textContent = '星期' + WEEK[current.getDay()] + (isToday ? ' · 今天' : '');
    $('datePicker').value = dayKey(current);

    $('stats').innerHTML = '今天 <b>' + entries(today()).length + '</b> 條 · 連續 <b>' + streak() + '</b> 天 · 累計 <b>' + totalCount() + '</b> 條';

    var arr = entries(current);
    if (!arr.length) {
      listEl.innerHTML = '<div class="empty">這一天還沒有記錄。<br>做成了一件事,就記一筆吧。</div>';
      return;
    }
    var k = dayKey(current);
    var card = document.createElement('div');
    card.className = 'card';

    arr.forEach(function (e) {
      var row = document.createElement('div');
      row.className = 'entry';

      var metaHtml = '<div class="meta">' + fmtTime(e.ts);
      if (e.status !== 'open') {
        metaHtml += ' · <span class="status-label ' + e.status + '">' + STATUS_LABEL[e.status] + '</span>';
      }
      metaHtml += '</div>';

      var actionsHtml = '';
      if (e.status === 'open') {
        actionsHtml =
          '<div class="actions">' +
            '<button data-s="done">做成了</button>' +
            '<button data-s="half">做了一半</button>' +
            '<button data-s="stuck">卡住了</button>' +
          '</div>';
      }

      row.innerHTML =
        '<span class="dot ' + e.status + '"></span>' +
        '<div class="body"><div class="text"></div>' + metaHtml + actionsHtml + '</div>' +
        '<button class="del" aria-label="刪除">×</button>';
      row.querySelector('.text').textContent = e.text;

      row.querySelector('.del').addEventListener('click', function () {
        if (confirm('刪掉這一條?')) removeEntry(k, e.id);
      });
      var label = row.querySelector('.status-label');
      if (label) {
        label.addEventListener('click', function () { setStatus(k, e.id, 'open'); });
      }
      var btns = row.querySelectorAll('.actions button');
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener('click', function () {
          setStatus(k, e.id, this.getAttribute('data-s'));
        });
      }
      card.appendChild(row);
    });

    listEl.innerHTML = '';
    listEl.appendChild(card);
  }

  // ---- events ----
  $('prevDay').addEventListener('click', function () { current.setDate(current.getDate() - 1); render(); });
  $('nextDay').addEventListener('click', function () { current.setDate(current.getDate() + 1); render(); });
  $('datePicker').addEventListener('change', function () {
    if (!this.value) return;
    var p = this.value.split('-');
    current = new Date(+p[0], +p[1] - 1, +p[2]);
    render();
  });

  $('btnPlan').addEventListener('click', function () { addEntry(inputEl.value, 'open'); inputEl.value = ''; inputEl.focus(); });
  $('btnDone').addEventListener('click', function () { addEntry(inputEl.value, 'done'); inputEl.value = ''; inputEl.focus(); });
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { addEntry(inputEl.value, 'done'); inputEl.value = ''; }
  });

  $('btnExport').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'backup-' + dayKey(today()) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  $('btnImport').addEventListener('click', function () { $('importFile').click(); });
  $('importFile').addEventListener('change', function () {
    var f = this.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var imported = JSON.parse(r.result);
        if (typeof imported !== 'object' || imported === null) throw new Error();
        if (!confirm('導入會覆蓋目前所有資料,確定嗎?(建議先導出備份)')) return;
        data = imported;
        save();
        render();
        alert('導入成功');
      } catch (e) {
        alert('文件格式不對,導入失敗');
      }
    };
    r.readAsText(f);
    this.value = '';
  });

  render();
})();
</script>
</body>
</html>
