<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>做到了</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #1c1c1e;
    --ink-2: #8a8a8e;
    --done: #34a853;
    --line: #e8e6e1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "PingFang TC", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  header {
    padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
  }
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .date-nav button {
    border: none;
    background: none;
    font-size: 26px;
    color: var(--ink-2);
    padding: 4px 14px;
    cursor: pointer;
  }
  .date-label {
    font-size: 18px;
    font-weight: 600;
    position: relative;
    cursor: pointer;
    text-align: center;
  }
  .date-label .sub { display: block; font-size: 12px; font-weight: 400; color: var(--ink-2); }
  #datePicker { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .stats {
    margin-top: 8px;
    font-size: 13px;
    color: var(--ink-2);
    text-align: center;
  }
  .stats b { color: var(--ink); font-weight: 600; }

  #list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 12px 12px;
  }
  .empty {
    text-align: center;
    color: var(--ink-2);
    font-size: 14px;
    margin-top: 60px;
    line-height: 1.8;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 0 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .entry {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .entry:last-child { border-bottom: none; }
  .entry:active { background: #fafaf8; }
  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }
  .dot.done { background: var(--done); }
  .dot.todo { background: transparent; border: 2px solid #c7c7cc; }
  .body { flex: 1; min-width: 0; }
  .text { font-size: 16px; line-height: 1.45; word-break: break-word; }
  .note {
    font-size: 14px;
    color: var(--ink-2);
    margin-top: 4px;
    line-height: 1.4;
    word-break: break-word;
  }
  .meta { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  .del {
    border: none; background: none; color: #c7c7cc; font-size: 18px;
    padding: 0 2px; cursor: pointer; flex-shrink: 0;
  }

  /* 底部彈窗 */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.3);
    display: flex;
    align-items: flex-end;
    z-index: 10;
  }
  #overlay[hidden] { display: none; }
  .sheet {
    background: #fff;
    width: 100%;
    border-radius: 16px 16px 0 0;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  .sheet-text {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 12px;
    word-break: break-word;
  }
  #sheetInput {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 16px;
    outline: none;
  }
  .sheet-btns { display: flex; gap: 8px; margin-top: 12px; }
  .sheet-btns button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 12px 0;
    font-size: 15px;
    cursor: pointer;
  }
  #sheetCancel { background: #eceef1; color: var(--ink); }
  #sheetOk { background: var(--ink); color: #fff; }
  #sheetUndone {
    display: block;
    margin: 12px auto 0;
    border: none;
    background: none;
    color: var(--ink-2);
    font-size: 13px;
    cursor: pointer;
  }

  footer {
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 10px);
    border-top: 1px solid var(--line);
  }
  #input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 12px;
    font-size: 16px;
    background: #fff;
    outline: none;
  }
  .add-btns { display: flex; gap: 8px; margin-top: 8px; }
  .add-btns button {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 11px 0;
    font-size: 15px;
    cursor: pointer;
  }
  .add-btns button:disabled { opacity: 0.35; }
  #btnPlan { background: #eceef1; color: var(--ink); }
  #btnDone { background: var(--ink); color: #fff; }
  .tools {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .tools button {
    border: none; background: none; color: var(--ink-2);
    font-size: 12px; cursor: pointer; padding: 2px 8px;
  }
  .ver { font-size: 10px; color: #d1d1d6; }
</style>
</head>
<body>

<header>
  <div class="date-nav">
    <button id="prevDay" aria-label="前一天">‹</button>
    <div class="date-label">
      <span id="dateText"></span>
      <span class="sub" id="weekText"></span>
      <input type="date" id="datePicker">
    </div>
    <button id="nextDay" aria-label="後一天">›</button>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div id="list"></div>

<footer>
  <input id="input" type="text" placeholder="先寫下來,再點下面的按鈕" enterkeyhint="done" autocomplete="off">
  <div class="add-btns">
    <button id="btnPlan" disabled>記為待做</button>
    <button id="btnDone" disabled>做到了,記一筆</button>
  </div>
  <div class="tools">
    <button id="btnExport">導出備份</button>
    <button id="btnImport">導入備份</button>
    <span class="ver">v0.4</span>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </div>
</footer>

<div id="overlay" hidden>
  <div class="sheet">
    <div class="sheet-text" id="sheetText"></div>
    <input id="sheetInput" type="text" placeholder="結果怎麼樣?一句話寫下來" enterkeyhint="done">
    <div class="sheet-btns">
      <button id="sheetCancel">取消</button>
      <button id="sheetOk">做了,記下</button>
    </div>
    <button id="sheetUndone" hidden>改回沒做</button>
  </div>
</div>

<script>
(function () {
  var KEY = 'wins.v1';
  var data = load();
  var current = today();

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('list'), inputEl = $('input');

  function load() {
    var d;
    try { d = JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch (e) { d = {}; }
    // 舊數據遷移:統一成 { text, done, note? }
    for (var k in d) {
      d[k].forEach(function (e) {
        if ('status' in e) {
          e.done = e.status !== 'open';
          delete e.status;
        }
        delete e.kind;
        if (!('done' in e)) e.done = true;
      });
    }
    return d;
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

  function pad(n) { return String(n).padStart(2, '0'); }
  function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { var d = new Date(); d.setHours(0,0,0,0); return d; }

  function entries(d) { return data[dayKey(d)] || []; }

  function addEntry(text, done) {
    text = text.trim();
    if (!text) return;
    var k = dayKey(current);
    if (!data[k]) data[k] = [];
    data[k].push({
      id: Date.now() + '' + Math.floor(Math.random() * 1000),
      text: text,
      done: done,
      ts: Date.now()
    });
    save();
    render();
  }

  function removeEntry(k, id) {
    data[k] = (data[k] || []).filter(function (e) { return e.id !== id; });
    if (!data[k].length) delete data[k];
    save();
    render();
  }

  // ---- stats ----
  function totalCount() {
    var n = 0;
    for (var k in data) n += data[k].length;
    return n;
  }
  function streak() {
    var d = today();
    if (!entries(d).length) d.setDate(d.getDate() - 1);
    var n = 0;
    while (entries(d).length) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  // ---- 底部彈窗:點一行,寫結果 ----
  var editing = null; // { k, e }

  function openSheet(k, e) {
    editing = { k: k, e: e };
    $('sheetText').textContent = e.text;
    $('sheetInput').value = e.note || '';
    $('sheetOk').textContent = e.done ? '記下' : '做了,記下';
    $('sheetUndone').hidden = !e.done;
    $('overlay').hidden = false;
    setTimeout(function () { $('sheetInput').focus(); }, 50);
  }
  function closeSheet() {
    editing = null;
    $('overlay').hidden = true;
    $('sheetInput').blur();
  }

  $('sheetOk').addEventListener('click', function () {
    if (!editing) return;
    var e = editing.e;
    var note = $('sheetInput').value.trim();
    if (note) e.note = note; else delete e.note;
    e.done = true;
    save();
    closeSheet();
    render();
  });
  $('sheetCancel').addEventListener('click', closeSheet);
  $('overlay').addEventListener('click', function (ev) {
    if (ev.target === this) closeSheet();
  });
  $('sheetInput').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') $('sheetOk').click();
  });
  $('sheetUndone').addEventListener('click', function () {
    if (!editing) return;
    editing.e.done = false;
    save();
    closeSheet();
    render();
  });

  // ---- render ----
  var WEEK = ['日','一','二','三','四','五','六'];
  function fmtTime(ts) {
    var d = new Date(ts);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function render() {
    var isToday = dayKey(current) === dayKey(today());
    $('dateText').textContent = (current.getMonth() + 1) + ' 月 ' + current.getDate() + ' 日';
    $('weekText').textContent = '星期' + WEEK[current.getDay()] + (isToday ? ' · 今天' : '');
    $('datePicker').value = dayKey(current);

    $('stats').innerHTML = '今天 <b>' + entries(today()).length + '</b> 條 · 連續 <b>' + streak() + '</b> 天 · 累計 <b>' + totalCount() + '</b> 條';

    var arr = entries(current);
    if (!arr.length) {
      listEl.innerHTML = '<div class="empty">這一天還沒有記錄。<br>做成了一件事,就記一筆吧。</div>';
      return;
    }
    var k = dayKey(current);
    var card = document.createElement('div');
    card.className = 'card';

    arr.forEach(function (e) {
      var row = document.createElement('div');
      row.className = 'entry';

      row.innerHTML =
        '<span class="dot ' + (e.done ? 'done' : 'todo') + '"></span>' +
        '<div class="body">' +
          '<div class="text"></div>' +
          (e.note ? '<div class="note"></div>' : '') +
          '<div class="meta">' + fmtTime(e.ts) + '</div>' +
        '</div>' +
        '<button class="del" aria-label="刪除">×</button>';
      row.querySelector('.text').textContent = e.text;
      var noteEl = row.querySelector('.note');
      if (noteEl) noteEl.textContent = '→ ' + e.note;

      row.addEventListener('click', function () { openSheet(k, e); });
      row.querySelector('.del').addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (confirm('刪掉這一條?')) removeEntry(k, e.id);
      });

      card.appendChild(row);
    });

    listEl.innerHTML = '';
    listEl.appendChild(card);
  }

  // ---- events ----
  $('prevDay').addEventListener('click', function () { current.setDate(current.getDate() - 1); render(); });
  $('nextDay').addEventListener('click', function () { current.setDate(current.getDate() + 1); render(); });
  $('datePicker').addEventListener('change', function () {
    if (!this.value) return;
    var p = this.value.split('-');
    current = new Date(+p[0], +p[1] - 1, +p[2]);
    render();
  });

  // 輸入框有字才允許錄入,避免「先點還是先寫」的困惑
  inputEl.addEventListener('input', function () {
    var has = inputEl.value.trim().length > 0;
    $('btnPlan').disabled = !has;
    $('btnDone').disabled = !has;
  });

  function afterAdd() {
    inputEl.value = '';
    $('btnPlan').disabled = true;
    $('btnDone').disabled = true;
    inputEl.focus();
  }
  $('btnPlan').addEventListener('click', function () { addEntry(inputEl.value, false); afterAdd(); });
  $('btnDone').addEventListener('click', function () { addEntry(inputEl.value, true); afterAdd(); });
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { addEntry(inputEl.value, true); afterAdd(); }
  });

  $('btnExport').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'backup-' + dayKey(today()) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  $('btnImport').addEventListener('click', function () { $('importFile').click(); });
  $('importFile').addEventListener('change', function () {
    var f = this.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var imported = JSON.parse(r.result);
        if (typeof imported !== 'object' || imported === null) throw new Error();
        if (!confirm('導入會覆蓋目前所有資料,確定嗎?(建議先導出備份)')) return;
        data = imported;
        save();
        render();
        alert('導入成功');
      } catch (e) {
        alert('文件格式不對,導入失敗');
      }
    };
    r.readAsText(f);
    this.value = '';
  });

  render();
})();
</script>
</body>
</html>
