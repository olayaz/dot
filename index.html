<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Dot">
<title>Dot</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #253e4a;
    --ink-2: #637780;
    --line: #dfe8ec;
    --accent: #deed82;
    --accent-ink: #34451b;
    --done: #367d9c;
    --blue-soft: #edf5f8;
    --surface: #f5f8f9;
    --open: #8fa4ae;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "PingFang TC", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 600px;
    margin: 0 auto;
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, .entry:focus-visible, .date-label:focus-within {
    outline: 2px solid var(--done);
    outline-offset: 3px;
  }
  header { padding: calc(env(safe-area-inset-top) + 24px) 28px 0; flex-shrink: 0; }
  .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 30px; }
  .brand { display: flex; align-items: baseline; gap: 5px; margin: 0; font-size: 27px; font-weight: 650; letter-spacing: -1px; }
  .brand::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .date-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .date-controls { display: flex; gap: 4px; }
  .date-nav button { border: none; border-radius: 50%; background: transparent; font-size: 25px; color: var(--ink-2); width: 44px; height: 44px; }
  .date-label { font-size: 22px; font-weight: 600; position: relative; cursor: pointer; }
  .date-label .sub { display: block; margin-top: 6px; font-size: 12px; font-weight: 400; color: var(--ink-2); }
  #datePicker { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
  .stats { font-size: 12px; color: var(--ink-2); text-align: right; line-height: 1.6; }
  .stats b { color: var(--ink); font-weight: 500; }
  .list-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 28px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .list-heading h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2); }
  .legend .dot { width: 7px; height: 7px; margin: 0 0 0 12px; }
  .legend .dot:first-child { margin-left: 0; }

  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 28px 24px; }
  .empty { text-align: center; color: var(--ink-2); font-size: 14px; margin-top: clamp(32px, 12vh, 100px); line-height: 1.8; }
  .empty::before { content: ''; display: block; width: 28px; height: 28px; margin: 0 auto 24px; border-radius: 50%; background: var(--accent); }
  .entries { margin: 0; padding: 0; list-style: none; }
  .entry { display: flex; align-items: flex-start; gap: 16px; padding: 22px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .entry:last-child { border-bottom: none; }
  .entry:active { background: var(--surface); }
  .dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
  .dot.done { background: var(--done); }
  .dot.todo { background: transparent; border: 1.5px solid var(--open); }
  .entry > .dot.done { box-shadow: 0 0 0 5px var(--blue-soft); }
  .entry.recorded > .dot { animation: settle 240ms ease-out; }
  @keyframes settle { from { transform: scale(.6); opacity: .4; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .entry.recorded > .dot { animation: none; } }
  .body { flex: 1; min-width: 0; }
  .topline { display: flex; align-items: baseline; gap: 10px; }
  .text { flex: 1; font-size: 16px; font-weight: 500; line-height: 1.6; overflow-wrap: anywhere; }
  .time { font-size: 11px; color: var(--ink-2); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .note { font-size: 14px; color: var(--ink-2); margin-top: 6px; line-height: 1.7; overflow-wrap: anywhere; }
  .del { border: none; background: none; color: var(--ink-2); font-size: 18px; min-width: 32px; min-height: 44px; margin: -9px -8px 0 -8px; padding: 0; flex-shrink: 0; }

  /* 居中懸浮窗口:不錨定屏幕底部,鍵盤彈出時只需在剩餘可視區域重新居中,
     位移很小;top/height 由 JS 跟隨 visualViewport 設置 */
  #overlay { position: fixed; left: 0; right: 0; top: 0; height: 100dvh; background: rgba(37,62,74,.2); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #overlay[hidden] { display: none; }
  .sheet { background: var(--bg); width: min(380px, 88%); max-height: calc(100% - 24px); overflow-y: auto; border-radius: 22px; padding: 24px; box-shadow: 0 16px 56px rgba(37,62,74,.14); }
  .sheet-text { font-size: 18px; font-weight: 600; line-height: 1.4; margin-bottom: 20px; overflow-wrap: anywhere; }
  #sheetInput { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 14px 12px; background: var(--surface); color: var(--ink); font-size: 16px; outline: none; }
  #sheetInput:focus { border-color: var(--done); box-shadow: 0 0 0 3px var(--blue-soft); }
  #sheetInput::placeholder { color: var(--ink-2); }
  .sheet-feedback { min-height: 18px; margin-top: 10px; color: var(--done); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
  .sheet-btns { display: flex; gap: 10px; margin-top: 16px; }
  .sheet-btns button { flex: 1; border: none; border-radius: 14px; padding: 14px 0; font-size: 15px; font-weight: 500; }
  #sheetCancel { background: var(--surface); color: var(--ink-2); }
  #sheetOk { background: var(--accent); color: var(--accent-ink); }
  #sheetUndone { display: block; margin: 12px auto 0; padding: 10px; border: none; background: none; color: var(--ink-2); font-size: 13px; }

  footer { padding: 18px 28px calc(env(safe-area-inset-bottom) + 8px); flex-shrink: 0; background: var(--bg); }
  .add-btns { display: flex; gap: 12px; }
  .add-btns button { border: 1px solid transparent; border-radius: 18px; padding: 17px 12px; font-size: 16px; font-weight: 500; }
  #btnPlan { flex: 1; background: var(--bg); border-color: var(--line); color: var(--ink-2); }
  #btnDone { flex: 1.5; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; gap: 10px; }
  #btnDone::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .tools { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 8px; }
  .tools button { border: none; background: none; color: var(--ink-2); font-size: 11px; padding: 10px 8px; }
  @media (hover: hover) {
    .entry:hover, .date-nav button:hover { background: var(--surface); }
    #btnPlan:hover, #sheetCancel:hover { background: var(--blue-soft); }
    #btnDone:hover, #sheetOk:hover { filter: brightness(.97); }
  }
  @media (max-width: 360px) {
    header { padding-left: 20px; padding-right: 20px; }
    #list, footer { padding-left: 20px; padding-right: 20px; }
    .entry { gap: 12px; }
  }
  @media (max-height: 600px) {
    .brand-row { margin-bottom: 16px; }
    .list-heading { margin-top: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <h1 class="brand">Dot</h1>
    <div class="stats" id="stats"></div>
  </div>
  <div class="date-nav">
    <div class="date-label">
      <span id="dateText"></span>
      <span class="sub" id="weekText"></span>
      <input type="date" id="datePicker" aria-label="選擇日期">
    </div>
    <div class="date-controls">
      <button id="prevDay" aria-label="前一天">‹</button>
      <button id="nextDay" aria-label="後一天">›</button>
    </div>
  </div>
  <div class="list-heading">
    <h2>記錄</h2>
    <div class="legend"><span class="dot todo" aria-hidden="true"></span>未做<span class="dot done" aria-hidden="true"></span>已做</div>
  </div>
</header>

<main id="list" aria-label="當日記錄"></main>

<footer>
  <div class="add-btns">
    <button id="btnPlan">寫計劃</button>
    <button id="btnDone">寫記錄</button>
  </div>
  <div class="tools">
    <button id="btnExport">匯出備份</button>
    <button id="btnImport">匯入備份</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </div>
</footer>

<div id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetText">
    <div class="sheet-text" id="sheetText"></div>
    <input id="sheetInput" type="text" enterkeyhint="done">
    <div class="sheet-feedback" id="sheetFeedback" role="status"></div>
    <div class="sheet-btns">
      <button id="sheetCancel">取消</button>
      <button id="sheetOk">儲存</button>
    </div>
    <button id="sheetUndone" hidden>改為未做</button>
  </div>
</div>

<script>
(function () {
  var KEY = 'wins.v1';
  var data = load();
  var current = today();
  var recordedId = null;

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('list');

  function load() {
    var d;
    try { d = JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch (e) { d = {}; }
    // 舊數據遷移:統一成 { text, done, note?, ts, doneTs? }
    for (var k in d) {
      d[k].forEach(function (e) {
        if ('status' in e) {
          e.done = e.status !== 'open';
          delete e.status;
        }
        delete e.kind;
        if (!('done' in e)) e.done = true;
      });
    }
    return d;
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

  function pad(n) { return String(n).padStart(2, '0'); }
  function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { var d = new Date(); d.setHours(0,0,0,0); return d; }

  function entries(d) { return data[dayKey(d)] || []; }

  function scrollToBottom() {
    requestAnimationFrame(function () { listEl.scrollTop = listEl.scrollHeight; });
  }

  function addEntry(text, done) {
    text = text.trim();
    if (!text) return false;
    var k = dayKey(current);
    if (!data[k]) data[k] = [];
    var now = Date.now();
    var e = {
      id: now + '' + Math.floor(Math.random() * 1000),
      text: text,
      done: done,
      ts: now
    };
    if (done) e.doneTs = now;
    data[k].push(e);
    save();
    recordedId = done ? e.id : null;
    render();
    scrollToBottom();
    return true;
  }

  function removeEntry(k, id) {
    data[k] = (data[k] || []).filter(function (e) { return e.id !== id; });
    if (!data[k].length) delete data[k];
    save();
    render();
  }

  // ---- stats ----
  function totalCount() {
    var n = 0;
    for (var k in data) n += data[k].length;
    return n;
  }

  // ---- 底部彈窗 ----
  // sheetMode: 'add-plan' | 'add-done' | 'edit'
  var sheetMode = null;
  var editing = null; // { k, e }

  function showSheet() {
    $('sheetFeedback').textContent = '';
    $('sheetInput').setAttribute('aria-label', sheetMode === 'edit' ? '結果' : sheetMode === 'add-plan' ? '計劃內容' : '記錄內容');
    $('overlay').hidden = false;
    syncViewport();
    setTimeout(function () { $('sheetInput').focus(); }, 50);
  }
  function closeSheet() {
    sheetMode = null;
    editing = null;
    $('overlay').hidden = true;
    $('overlay').style.top = '';
    $('overlay').style.height = '';
    $('sheetInput').blur();
  }

  // 點底部按鈕:彈出輸入窗口,後面的列表仍然可見
  function openAddSheet(kind) {
    sheetMode = kind === 'plan' ? 'add-plan' : 'add-done';
    editing = null;
    $('sheetText').textContent = kind === 'plan' ? '寫計劃' : '寫記錄';
    $('sheetInput').value = '';
    $('sheetInput').placeholder = kind === 'plan' ? '打算做什麼？' : '做了什麼，結果如何？';
    $('sheetOk').textContent = '新增';
    $('sheetCancel').textContent = '關閉';
    $('sheetUndone').hidden = true;
    scrollToBottom();
    showSheet();
  }

  // 點某一行:寫/改結果
  function openEditSheet(k, e) {
    sheetMode = 'edit';
    editing = { k: k, e: e };
    $('sheetText').textContent = e.text;
    $('sheetInput').value = e.note || '';
    $('sheetInput').placeholder = '結果如何？';
    $('sheetOk').textContent = '儲存';
    $('sheetCancel').textContent = '取消';
    $('sheetUndone').hidden = !e.done;
    showSheet();
  }

  $('sheetOk').addEventListener('click', function () {
    var inp = $('sheetInput');
    if (sheetMode === 'edit') {
      if (!editing) return;
      var e = editing.e;
      var note = inp.value.trim();
      if (note) e.note = note; else delete e.note;
      if (!e.done) e.doneTs = Date.now(); // 時間 = 標記為做了的那一刻
      e.done = true;
      save();
      recordedId = e.id;
      closeSheet();
      render();
    } else if (sheetMode) {
      // 記一條,清空,窗口不收起,可連續記;新行立刻出現在後面的列表裡
      if (addEntry(inp.value, sheetMode === 'add-done')) {
        $('sheetFeedback').textContent = '已新增：' + inp.value.trim();
        inp.value = '';
        inp.focus();
      } else {
        $('sheetFeedback').textContent = '請先輸入內容';
      }
    }
  });
  $('sheetCancel').addEventListener('click', closeSheet);
  $('overlay').addEventListener('click', function (ev) {
    if (ev.target === this) closeSheet();
  });
  $('sheetInput').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.isComposing) $('sheetOk').click();
    if (ev.key === 'Escape') closeSheet();
  });
  $('sheetUndone').addEventListener('click', function () {
    if (!editing) return;
    editing.e.done = false;
    delete editing.e.doneTs;
    save();
    closeSheet();
    render();
  });

  // 鍵盤彈出時 Safari 會滾動並縮小可視區域;
  // 彈窗的 top 和 height 都實時跟隨,保證貼在鍵盤上方不被推走
  function syncViewport() {
    var vv = window.visualViewport;
    if (!vv || $('overlay').hidden) return;
    $('overlay').style.top = vv.offsetTop + 'px';
    $('overlay').style.height = vv.height + 'px';
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncViewport);
    window.visualViewport.addEventListener('scroll', syncViewport);
  }

  // ---- render ----
  var WEEK = ['日','一','二','三','四','五','六'];
  function fmtTime(ts) {
    var d = new Date(ts);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function render() {
    var isToday = dayKey(current) === dayKey(today());
    $('dateText').textContent = (current.getMonth() + 1) + ' 月 ' + current.getDate() + ' 日';
    $('weekText').textContent = '星期' + WEEK[current.getDay()] + (isToday ? ' · 今天' : '');
    $('datePicker').value = dayKey(current);

    $('stats').innerHTML = '當日 <b>' + entries(current).length + '</b> 則 · 共 <b>' + totalCount() + '</b> 則';

    var arr = entries(current);
    if (!arr.length) {
      listEl.innerHTML = '<div class="empty">這天還沒有記錄</div>';
      return;
    }
    var k = dayKey(current);
    var entryList = document.createElement('ul');
    entryList.className = 'entries';

    arr.forEach(function (e) {
      var row = document.createElement('li');
      row.className = 'entry' + (e.id === recordedId ? ' recorded' : '');
      row.tabIndex = 0;
      row.setAttribute('aria-label', (e.done ? '已做：' : '未做：') + e.text + '，編輯結果');

      // 只有「做了」才有時間可說:顯示標記完成的那一刻,同行末尾小灰字
      var timeHtml = e.done ? '<span class="time" title="記錄時間">' + fmtTime(e.doneTs || e.ts) + '</span>' : '';

      row.innerHTML =
        '<span class="dot ' + (e.done ? 'done' : 'todo') + '"></span>' +
        '<div class="body">' +
          '<div class="topline"><div class="text"></div>' + timeHtml + '</div>' +
          (e.note ? '<div class="note"></div>' : '') +
        '</div>' +
        '<button class="del" aria-label="刪除">×</button>';
      row.querySelector('.text').textContent = e.text;
      var noteEl = row.querySelector('.note');
      if (noteEl) noteEl.textContent = e.note;

      row.addEventListener('click', function () { openEditSheet(k, e); });
      row.addEventListener('keydown', function (ev) {
        if (ev.target === row && (ev.key === 'Enter' || ev.key === ' ')) {
          ev.preventDefault();
          openEditSheet(k, e);
        }
      });
      row.querySelector('.del').addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (confirm('刪掉這一條?')) removeEntry(k, e.id);
      });

      entryList.appendChild(row);
    });

    listEl.innerHTML = '';
    listEl.appendChild(entryList);
    recordedId = null;
  }

  // ---- 底部兩個按鈕:唯一的輸入入口 ----
  $('btnPlan').addEventListener('click', function () { openAddSheet('plan'); });
  $('btnDone').addEventListener('click', function () { openAddSheet('done'); });

  // ---- 日期切換 ----
  $('prevDay').addEventListener('click', function () { current.setDate(current.getDate() - 1); render(); });
  $('nextDay').addEventListener('click', function () { current.setDate(current.getDate() + 1); render(); });
  $('datePicker').addEventListener('change', function () {
    if (!this.value) return;
    var p = this.value.split('-');
    current = new Date(+p[0], +p[1] - 1, +p[2]);
    render();
  });

  // ---- 備份 ----
  $('btnExport').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'backup-' + dayKey(today()) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  $('btnImport').addEventListener('click', function () { $('importFile').click(); });
  $('importFile').addEventListener('change', function () {
    var f = this.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var imported = JSON.parse(r.result);
        if (typeof imported !== 'object' || imported === null) throw new Error();
        if (!confirm('匯入會覆蓋目前所有資料,確定嗎?(建議先匯出備份)')) return;
        data = imported;
        save();
        render();
        alert('匯入成功');
      } catch (e) {
        alert('文件格式不對,匯入失敗');
      }
    };
    r.readAsText(f);
    this.value = '';
  });

  render();
})();
</script>
</body>
</html>
